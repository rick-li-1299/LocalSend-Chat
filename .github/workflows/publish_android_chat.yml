name: Verify and publish signed Android APK
on:
  push:
    branches: [android/signature]
    paths: ['.android-signing/response.json']
permissions:
  contents: write
  actions: read
jobs:
  publish-android:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Prepare Android verification tools
        run: sdkmanager 'build-tools;36.0.0'
      - name: Read approved request provenance
        id: request
        shell: python
        run: |
          import json, os, pathlib, re
          response = json.loads(pathlib.Path('.android-signing/response.json').read_text())
          request = response['request']
          assert re.fullmatch('[0-9a-f]{40}', request['source_commit']) and request['workflow_run_id'].isdigit()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f"commit={request['source_commit']}\nrun_id={request['workflow_run_id']}\n")
      - uses: actions/download-artifact@v6
        with:
          name: unsigned-android-arm64-${{ steps.request.outputs.commit }}
          run-id: ${{ steps.request.outputs.run_id }}
          github-token: ${{ github.token }}
          path: unsigned
      - name: Assemble and independently verify APK signature
        run: |
          python -m pip install 'cryptography>=46,<47'
          mkdir -p dist
          python support/scripts/android_apk_signing.py assemble --apk unsigned/unsigned.apk --certificate support/android/release-certificate.pem --request unsigned/signing-request.json --response .android-signing/response.json --output dist/LocalSend-Chat-android-arm64.apk
          tools="$ANDROID_HOME/build-tools/36.0.0"
          "$tools/apksigner" verify --verbose --print-certs --min-sdk-version 27 dist/LocalSend-Chat-android-arm64.apk
          "$tools/zipalign" -c -P 16 -v 4 dist/LocalSend-Chat-android-arm64.apk
          (cd dist && sha256sum LocalSend-Chat-android-arm64.apk > ANDROID-SHA256SUMS.txt)
      - name: Publish Android release without changing the Windows update channel
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_COMMIT: ${{ steps.request.outputs.commit }}
        run: |
          printf '%s\n' 'LocalSend Chat for Android 8.1+ (ARM64). Signed using the maintainer-held Android release key. Includes mobile chat, LAN file sharing and group chat. Physical-device interoperability remains to be tested.' > notes.txt
          gh release create android-v1.0.0 dist/* --target "$SOURCE_COMMIT" --latest=false --title 'LocalSend Chat Android 1.0.0' --notes-file notes.txt
